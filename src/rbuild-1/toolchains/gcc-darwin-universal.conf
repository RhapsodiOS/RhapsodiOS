# Profile for both CPUs. build-src.ps1 -Kernel and -KernelDrivers build i386,
# then ppc. -Rbuild and -Bootstrap never hand this file to rbuild: they use the
# thin gcc-darwin-<guest cpu>.conf beside it, unchanged, so bootstrap state and
# its toolchain fingerprint stay valid.
profile=gcc-darwin-universal-macho
build_cc=/usr/bin/cc
target_cc=/usr/bin/cc
target_arch=universal
target_ar=/usr/bin/ar
target_ranlib=/usr/bin/ranlib
make=/bin/make
make_flags=MAKEFILEDIR=@SYSROOT@/System/Developer/Makefiles/project MAKEFILEPATH=@SYSROOT@/System/Developer/Makefiles
make_flags_ready=@SYSROOT@/System/Developer/Makefiles/project/platform.make
shell=/bin/sh
tar=/build/src/rbuild-1/pax-gnutar.sh
archive_create=/bin/pax
archive_create_flags=-w -x ustar
gzip=/usr/bin/gzip
rsync=/usr/bin/rsync
# /usr/local/bin holds bootstrap-cmds' relpath, which kernel-7 needs inside the build chroot.
path=/build/tools/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
arch_flags=-arch i386 -arch ppc
cpp_flags=-nostdinc -F@SYSROOT@/System/Library/Frameworks -I@SYSROOT@/System/Library/Frameworks/System.framework/Versions/B/Headers -I@SYSROOT@/System/Library/Frameworks/System.framework/Versions/B/Headers/bsd -I@SYSROOT@/System/Library/Frameworks/System.framework/Versions/B/PrivateHeaders
cpp_flags_ready=@SYSROOT@/Developer/Libraries/gcc-lib/ppc/ginclude/stdarg.h
ld_flags=-Wl,-syslibroot,@SYSROOT@
ld_flags_ready=@SYSROOT@/System/Library/Frameworks/System.framework/Versions/B/System
ln=/bin/ln
